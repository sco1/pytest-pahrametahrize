[project]
name = "pytest-pahrametahrize"
version = "1.0.0"
description = "Parametrize your tests with a Boston accent"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "sco1", email = "sco1.git@gmail.com"}
]

readme = "README.md"
classifiers = [
    "Development Status :: 6 - Mature",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

requires-python = ">=3.11"
dependencies = [
]

[project.urls]
Homepage = "https://github.com/sco1/"
Documentation = "https://github.com/sco1/pytest-pahrametahrize/blob/main/README.md"
Repository = "https://github.com/sco1/pytest-pahrametahrize.git"
Issues = "https://github.com/sco1/pytest-pahrametahrize/issues"
Changelog = "https://github.com/sco1/pytest-pahrametahrize/blob/main/CHANGELOG.md"

[project.entry-points."pytest11"]
"pytest-pahrametahrize" = "pytest_pahrametahrize"

[tool.poetry.dependencies]
python = "^3.9"
pytest = ">=6.0"

[tool.uv]
dev-dependencies = [
    "black~=25.0",
    "bump2version~=1.0",
    "flake8~=7.1",
    "flake8-annotations~=3.1",
    "isort~=6.0",
    "mypy~=1.14",
    "pre-commit~=4.0",
    "pytest~=8.3",
    "pytest-check~=2.4",
    "pytest-cov~=6.0",
    "pytest-randomly~=3.16",
    "ruff~=0.9",
    "tox~=4.23",
    "tox-uv~=1.17",
]

[tool.black]
line-length = 100

[tool.isort]
case_sensitive = true
known_first_party = "pytest-pahrametahrize,tests"
no_lines_before = "LOCALFOLDER"
order_by_type = false
profile = "black"
line_length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
